<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Active Dial</title>
  <style>
    body {
      font-family: "Poppins", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #000000 0%, #1a1a1a 100%);
      color: white;
    }
    header {
      background: linear-gradient(90deg, #d4af37, #b8860b);
      color: black;
      padding: 20px;
      text-align: center;
      font-weight: bold;
    }
    header h1 {
      font-size: 2em;
      margin: 0;
    }
    header p {
      color: black;
    }
    .products {
      display: flex;
      justify-content: space-around;
      margin: 20px;
      flex-wrap: wrap;
    }
    .product {
      background: #111;
      border: 2px solid #d4af37;
      border-radius: 10px;
      width: 230px;
      margin: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 0 10px rgba(212,175,55,0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .product:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px rgba(212,175,55,0.6);
    }
    .product img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #d4af37;
    }
    .cart, .order-form {
      margin: 20px;
      padding: 15px;
      background: #111;
      border: 2px solid #d4af37;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(212,175,55,0.2);
    }
    label {
      display: block;
      margin-top: 10px;
      color: white;
    }
    input, textarea, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #d4af37;
      background: #000;
      color: white;
    }
    button {
      background: #d4af37;
      color: black;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #b8860b;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h1>Active Dial</h1>
    <p>Welcome! Select your Rolex masterpiece and place your order.</p>
  </header>

  <section class="products">
    <div class="product">
      <img src="https://cdn.shopify.com/s/files/1/0278/9723/3501/files/Rolex-Rainbow-Daytona-Sothebys-2.jpg?v=1750433268" alt="Rainbow Daytona">
      <h3>Rainbow Daytona</h3>
      <p>P40,000,000</p>
      <button onclick="addToCart('Rainbow Daytona', 40000000)">Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://cdn.shopify.com/s/files/1/0278/9723/3501/files/Rolex-Starbucks-Submariner-2.jpg?v=1757285341" alt="Rolex Submariner Date Oystersteel">
      <h3>Rolex Submariner Date Oystersteel</h3>
      <p>P10,000,000</p>
      <button onclick="addToCart('Rolex Submariner Date Oystersteel', 10000000)">Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://teddybaldassarre.com/cdn/shop/articles/Rolex-Oysterquartz-Datejust-FI_38db1917-8460-4e10-9b1d-bbacafbdc649_2000x.jpg?v=1760014207" alt="Rolex Datejust 41 Yellow Rolesor">
      <h3>Rolex Datejust 41 Yellow Rolesor</h3>
      <p>P12,000,000</p>
      <button onclick="addToCart('Rolex Datejust 41 Yellow Rolesor', 12000000)">Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://cdn.shopify.com/s/files/1/0278/9723/3501/files/3864C1FC-16DF-492A-93B8-70C219C17D34_1_201_a_2048x2048.jpg?v=1749678012" alt="Rolex Submariner 41">
      <h3>Rolex Submariner 41</h3>
      <p>P8,000,000</p>
      <button onclick="addToCart('Rolex Submariner 41', 8000000)">Add to Cart</button>
    </div>
  </section>

  <section class="cart">
    <h2>🛒 Shopping Cart</h2>
    <ul id="cart-items"></ul>
    <p><strong>Total: P<span id="cart-total">0</span></strong></p>
  </section>

  <section class="order-form">
    <h2>📝 Order Form</h2>
    <form onsubmit="submitOrder(event)">
      <label for="name">Full Name</label>
      <input type="text" id="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="phone">Phone Number</label>
      <input type="text" id="phone" required>

      <label for="address">Shipping Address</label>
      <textarea id="address" required></textarea>

      <label for="payment">Payment Method</label>
      <select id="payment">
        <option value="COD">Cash on Delivery</option>
        <option value="GCash">GCash</option>
        <option value="Bank">Bank Transfer</option>
      </select>

      <button type="submit">Submit Order</button>
    </form>
  </section>

  <script>
    let cart = [];
    let total = 0;

    function addToCart(product, price) {
      cart.push({ product, price });
      total += price;
      displayCart();
    }

    function displayCart() {
      const cartItems = document.getElementById('cart-items');
      cartItems.innerHTML = '';

      cart.forEach(item => {
        let li = document.createElement('li');
        li.textContent = `${item.product} - P${item.price.toLocaleString()}`;
        cartItems.appendChild(li);
      });

      document.getElementById('cart-total').textContent = total.toLocaleString();
    }

    function submitOrder(event) {
      event.preventDefault();

      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const address = document.getElementById('address').value;
      const payment = document.getElementById('payment').value;

      const orderSummary = cart.map(item => `- ${item.product}: P${item.price.toLocaleString()}`).join("\n");

      alert(
        `Thank you, ${name}!\n\nOrder Summary:\n${orderSummary}\n\nTotal: P${total.toLocaleString()}\nPayment Method: ${payment}\n\nWe will ship to:\n${address}`
      );

      cart = [];
      total = 0;
      displayCart();
      document.querySelector("form").reset();
    }
  </script>
</body>
</html>
